<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawler Robot Live Camera Telemetry</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #controls {
            width: 100%;
            max-width: 480px;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        select, button {
            flex: 1;
            padding: 12px;
            background-color: #333;
            color: #00ffcc;
            border: 2px solid #555;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        button {
            background-color: #00ffcc;
            color: #1e1e1e;
            border: none;
        }
        #hud {
            width: 100%;
            max-width: 480px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.4;
        }
        canvas {
            background-color: #111;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        /* Hidden hardware utility elements */
        #videoFeed, #hiddenCanvas {
            display: none;
        }
    </style>
</head>
<body>

    <div id="controls">
        <select id="targetSelect">
            <option value="Neck (Home)">Target: Neck (Home)</option>
            <option value="Left Teres">Target: Left Teres</option>
            <option value="Left Triceps">Target: Left Triceps</option>
            <option value="Right Teres">Target: Right Teres</option>
            <option value="Right Triceps">Target: Right Triceps</option>
        </select>
        <button id="startBtn">Activate Camera & Sensors</button>
    </div>

    <div id="hud">
        <strong>REAL HARDWARE TELEMETRY</strong><br>
        Target: <span id="valTarget" style="color:#00ffcc">Neck (Home)</span><br>
        X: <span id="valX">0.0</span> mm | Y: <span id="valY">0.0</span> mm<br>
        Heading: <span id="valAngle">0.0</span>°
    </div>

    <!-- Main Telemetry Map Screen -->
    <canvas id="mapCanvas" width="480" height="320"></canvas>

    <!-- Hidden Video Pipeline Infrastructure -->
    <video id="videoFeed" autoplay playsinline></video>
    <canvas id="hiddenCanvas" width="160" height="120"></canvas>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const targetSelect = document.getElementById('targetSelect');
        const video = document.getElementById('videoFeed');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const hiddenCtx = hiddenCanvas.getContext('2d');

        // --- ROBOT STATE (Driven by true sensors) ---
        let robotX = 0.0;
        let robotY = 0.0;
        let robotAngle = 0.0; 
        let activeTargetKey = "Neck (Home)";

        // Optical flow processing frames
        let prevFrameData = null;

        // --- CALIBRATION FACTOR ---
        // How many camera pixels equal 1 millimeter of actual movement.
        // Adjust this number based on how high the camera sits above your back!
        const PIXELS_PER_MM = 1.8; 

        const TARGETS = {
            "Neck (Home)":   { x: 0,    y: 0,    color: "green" },
            "Left Teres":    { x: -120, y: -180, color: "red" },
            "Left Triceps":  { x: -180, y: -280, color: "orange" },
            "Right Teres":   { x: 120,  y: -180, color: "red" },
            "Right Triceps": { x: 180,  y: -280, color: "orange" }
        };

        function toCanvasCoords(mmX, mmY) {
            return {
                x: 240 + (mmX * 0.5),
                y: 160 + (mmY * 0.5) 
            };
        }

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw Target Landmarks
            for (const [name, target] of Object.entries(TARGETS)) {
                let pos = toCanvasCoords(target.x, target.y);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 8, 0, 2 * Math.PI);
                ctx.fillStyle = target.color;
                ctx.fill();

                if (name === activeTargetKey) {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 14, 0, 2 * Math.PI);
                    ctx.strokeStyle = "#00ffcc";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                ctx.fillStyle = "white";
                ctx.font = "bold 10px Arial";
                ctx.fillText(" " + name, pos.x + 10, pos.y + 4);
            }

            // 2. Draw Active Position Indicator
            let robotPos = toCanvasCoords(robotX, robotY);
            ctx.save();
            ctx.translate(robotPos.x, robotPos.y);
            ctx.rotate((robotAngle * Math.PI) / 180); 

            ctx.beginPath();
            ctx.moveTo(0, -12);  
            ctx.lineTo(-8, 8);   
            ctx.lineTo(8, 8);    
            ctx.closePath();
            ctx.fillStyle = "#00ffcc";
            ctx.fill();
            ctx.restore();

            // 3. Render Metric Data
            document.getElementById('valTarget').innerText = activeTargetKey;
            document.getElementById('valX').innerText = robotX.toFixed(1);
            document.getElementById('valY').innerText = robotY.toFixed(1);
            document.getElementById('valAngle').innerText = robotAngle.toFixed(1);
        }

        targetSelect.addEventListener('change', (e) => {
            activeTargetKey = e.target.value;
            drawMap();
        });

        // --- ACTIVATING GENUINE SMARTPHONE SENSORS ---
        document.getElementById('startBtn').addEventListener('click', async () => {
            // 1. Hook up the Phone's Gyroscope/Compass for True Rotation Tracking
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                    }
                } catch (e) { alert("Motion sensors blocked: " + e); }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }

            // 2. Initialize Rear Facing Video Stream for True Physical Positioning
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } }, // Forces back camera
                    audio: false
                });
                video.srcObject = stream;
                document.getElementById('startBtn').style.display = 'none';
                
                // Start real-time image processing loop
                requestAnimationFrame(processCameraFrame);
            } catch (err) {
                alert("Camera Initialization Error! Make sure to allow camera permissions: " + err);
            }
        });

        function handleOrientation(event) {
            // Absolute magnetic alpha/compass orientation
            if (event.alpha !== null) {
                robotAngle = (360 - event.alpha) % 360; 
                drawMap();
            }
        }

        // --- OPTICAL FLOW TRACKING MATHEMATICS (TRUE INPUT DATA) ---
        function processCameraFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Down-sample the frame to 160x120 to keep mobile execution lighting fast
                hiddenCtx.drawImage(video, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
                const currentFrame = hiddenCtx.getImageData(0, 0, hiddenCanvas.width, hiddenCanvas.height);

                if (prevFrameData) {
                    let flowX = 0;
                    let flowY = 0;
                    let sampleCount = 0;

                    const curr = currentFrame.data;
                    const prev = prevFrameData.data;
                    const w = hiddenCanvas.width;
                    const h = hiddenCanvas.height;

                    // Block matching step calculation (Simplified Optical Tracker)
                    // Compares brightness adjustments across a 2D sample grid
                    for (let y = 20; y < h - 20; y += 15) {
                        for (let x = 20; x < w - 20; x += 15) {
                            let idx = (y * w + x) * 4;
                            let brightnessDiff = curr[idx] - prev[idx]; // Compare Grayscale variance

                            if (Math.abs(brightnessDiff) > 12) {
                                // Accumulate coordinate shift vectors
                                flowX += (curr[idx] - curr[idx + 4]); 
                                flowY += (curr[idx] - curr[idx + (w * 4)]);
                                sampleCount++;
                            }
                        }
                    }

                    if (sampleCount > 5) {
                        // Average pixel drift calculation
                        let pixelMoveX = (flowX / sampleCount) * 0.1;
                        let pixelMoveY = (flowY / sampleCount) * 0.1;

                        // Dead-reckoning: Rotate the movement matrix to match phone heading
                        let rad = (robotAngle * Math.PI) / 180;
                        let deltaX = (pixelMoveX * Math.cos(rad) - pixelMoveY * Math.sin(rad)) / PIXELS_PER_MM;
                        let deltaY = (pixelMoveX * Math.sin(rad) + pixelMoveY * Math.cos(rad)) / PIXELS_PER_MM;

                        // Inject real physics values into live map telemetry
                        robotX += deltaX;
                        robotY += deltaY;
                    }
                }

                prevFrameData = currentFrame;
                drawMap();
            }
            // Keep frame updates rolling infinitely
            requestAnimationFrame(processCameraFrame);
        }

        drawMap();
    </script>
</body>
</html>
