<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawler Robot Calibrated Telemetry</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; 
        }
        #controls {
            width: 100%;
            max-width: 640px;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        select, button {
            flex: 1;
            padding: 12px;
            background-color: #333;
            color: #00ffcc;
            border: 2px solid #555;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button {
            background-color: #00ffcc;
            color: #1e1e1e;
            border: none;
        }
        button:hover {
            background-color: #00cca3;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        #hud {
            width: 100%;
            max-width: 640px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.4;
            background: #252525;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #00ffcc;
        }
        canvas {
            background-color: #111;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            cursor: crosshair;
        }
        #lockMessage {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
            max-width: 640px;
        }
        .status-locked {
            color: #00ffcc !important;
            font-weight: bold;
        }
        .status-unlocked {
            color: #ff3366 !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="controls">
        <select id="targetSelect">
            <option value="Neck (Home)">Target: Neck (Home)</option>
            <option value="Left Teres">Target: Left Teres</option>
            <option value="Left Triceps">Target: Left Triceps</option>
            <option value="Right Teres">Target: Right Teres</option>
            <option value="Right Triceps">Target: Right Triceps</option>
        </select>
        <button id="startBtn">Click Map to Lock Cursor</button>
    </div>

    <div id="hud">
        <strong>CALIBRATED COMPASS GRID TELEMETRY</strong> [<span id="lockStatus" class="status-unlocked">CURSOR UNLOCKED</span>]<br>
        Target: <span id="valTarget" style="color:#00ffcc">Neck (Home)</span><br>
        X: <span id="valX">0.0</span> mm | Y: <span id="valY">0.0</span> mm<br>
        Relative Heading: <span id="valAngle">0.0</span>°
    </div>

    <canvas id="mapCanvas" width="640" height="400"></canvas>
    
    <div id="lockMessage">
        Position the phone on your starting point, face straight forward, and click the box.<br>
        Press your phone's <strong>Back Button</strong> (or ESC on a PC) to release the cursor.
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const targetSelect = document.getElementById('targetSelect');
        const lockStatusDisplay = document.getElementById('lockStatus');

        // --- ROBOT STATE (Driven by true sensors) ---
        let robotX = 0.0;
        let robotY = 0.0;
        let robotAngle = 0.0; 
        let activeTargetKey = "Neck (Home)";

        // --- THE INITIAL COMPASS ANCHOR OFFSET ---
        let startAngleOffset = null; 

        // --- UPDATED CALIBRATION SCALING ---
        // Raised this from 0.036 to 16.0 to cut down sensitivity massively!
        // If it is still too sensitive, change 16.0 to a higher number like 32.0.
        const MOUSE_COUNTS_PER_MM = 16.0; 

        const TARGETS = {
            "Neck (Home)":   { x: 0,    y: 0,    color: "green" },
            "Left Teres":    { x: -120, y: -180, color: "red" },
            "Left Triceps":  { x: -180, y: -280, color: "orange" },
            "Right Teres":   { x: 120,  y: -180, color: "red" },
            "Right Triceps": { x: 180,  y: -280, color: "orange" }
        };

        function toCanvasCoords(mmX, mmY) {
            return {
                x: (canvas.width / 2) + (mmX * 0.5),
                y: (canvas.height / 2) + (mmY * 0.5) 
            };
        }

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw local coordinate baseline reference lines
            ctx.strokeStyle = "#222222";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            // 1. Draw Landmarks
            for (const [name, target] of Object.entries(TARGETS)) {
                let pos = toCanvasCoords(target.x, target.y);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 8, 0, 2 * Math.PI);
                ctx.fillStyle = target.color;
                ctx.fill();

                if (name === activeTargetKey) {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 14, 0, 2 * Math.PI);
                    ctx.strokeStyle = "#00ffcc";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                ctx.fillStyle = "white";
                ctx.font = "bold 10px monospace";
                ctx.fillText(" " + name, pos.x + 10, pos.y + 4);
            }

            // 2. Draw Moving Indicator
            let robotPos = toCanvasCoords(robotX, robotY);
            ctx.save();
            ctx.translate(robotPos.x, robotPos.y);
            ctx.rotate((robotAngle * Math.PI) / 180); 

            ctx.beginPath();
            ctx.moveTo(0, -12);  
            ctx.lineTo(-8, 8);   
            ctx.lineTo(8, 8);    
            ctx.closePath();
            ctx.fillStyle = "#00ffcc";
            ctx.fill();
            ctx.restore();

            // 3. Render Metric Data
            document.getElementById('valTarget').innerText = activeTargetKey;
            document.getElementById('valX').innerText = robotX.toFixed(1);
            document.getElementById('valY').innerText = robotY.toFixed(1);
            document.getElementById('valAngle').innerText = robotAngle.toFixed(1);
        }

        targetSelect.addEventListener('change', (e) => {
            activeTargetKey = e.target.value;
            drawMap();
        });

        // --- POINTER CAPTURE & AUTOCALIBRATION SEQUENCE ---
        canvas.addEventListener('click', async () => {
            startAngleOffset = null;

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceOrientationEvent.requestPermission();
                    if (permissionState === 'granted') {
                        window.addEventListener('deviceorientation', handleCompassInput);
                    }
                } catch (e) { console.error("Compass access blocked: " + e); }
            } else {
                window.addEventListener('deviceorientation', handleCompassInput);
            }

            canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
            canvas.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', lockChangeAlert, false);

        function lockChangeAlert() {
            if (document.pointerLockElement === canvas) {
                lockStatusDisplay.innerText = "CURSOR LOCKED (ACTIVE)";
                lockStatusDisplay.className = "status-locked";
                document.addEventListener("mousemove", updatePosition, false);
            } else {
                lockStatusDisplay.innerText = "CURSOR UNLOCKED (PAUSED)";
                lockStatusDisplay.className = "status-unlocked";
                document.removeEventListener("mousemove", updatePosition, false);
                startAngleOffset = null; 
            }
        }

        // --- REAL HARDWARE COMPASS CORRECTION ENGINE ---
        function handleCompassInput(event) {
            let rawHeading = event.webkitCompassHeading || (360 - event.alpha);
            
            if (rawHeading !== undefined && rawHeading !== null) {
                if (startAngleOffset === null) {
                    startAngleOffset = rawHeading;
                }

                let relativeHeading = rawHeading - startAngleOffset;
                robotAngle = (relativeHeading + 360) % 360;
                drawMap();
            }
        }

        // --- UNBOUNDED SPATIAL TRANSLATION MATRIX ---
        function updatePosition(event) {
            let movementX = event.movementX || 0;
            let movementY = event.movementY || 0;

            let rawMmX = movementX / MOUSE_COUNTS_PER_MM;
            let rawMmY = movementY / MOUSE_COUNTS_PER_MM;

            let rad = (robotAngle * Math.PI) / 180;

            let deltaX = rawMmX * Math.cos(rad) - rawMmY * Math.sin(rad);
            let deltaY = rawMmX * Math.sin(rad) + rawMmY * Math.cos(rad);

            robotX += deltaX;
            robotY += deltaY;

            drawMap();
        }

        drawMap();
    </script>
</body>
</html>
