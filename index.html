<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Wireless Pilot</title><style>*{box-sizing:border-box;}body{background-color:#1e1e1e;color:white;font-family:'Courier New',Courier,monospace;margin:0;padding:15px;display:flex;flex-direction:column;align-items:center;overflow:hidden;}#controls{width:100%;max-width:640px;margin-bottom:10px;display:flex;flex-direction:column;gap:12px;background:#252525;padding:15px;border-radius:5px;border-bottom:3px solid #333;}.row{display:flex;gap:10px;width:100%;align-items:center;}select,button{flex:1;padding:12px;background-color:#333;color:#00ffcc;border:2px solid #555;border-radius:5px;font-weight:bold;font-size:14px;cursor:pointer;transition:all 0.2s ease;}button{background-color:#00ffcc;color:#1e1e1e;border:none;}button:hover{background-color:#00cca3;box-shadow:0 0 10px rgba(0,255,204,0.4);}.slider-container{display:flex;align-items:center;gap:15px;width:100%;font-size:13px;color:#00ffcc;font-weight:bold;}input[type="range"]{flex:1;accent-color:#00ffcc;cursor:pointer;}#hud{width:100%;max-width:640px;margin-bottom:10px;font-size:14px;line-height:1.4;background:#252525;padding:10px;border-radius:5px;border-left:4px solid #00ffcc;}canvas{background-color:#111;border:2px solid #333;border-radius:8px;box-shadow:0 4px 15px rgba(0,0,0,0.6);cursor:crosshair;}.status-locked{color:#00ffcc!important;font-weight:bold;}.status-unlocked{color:#ff3366!important;font-weight:bold;}</style></head><body><div id="controls"><div class="row"><select id="targetSelect"><option value="Neck (Home)">Target: Neck (Home)</option><option value="Left Teres">Target: Left Teres</option><option value="Left Triceps">Target: Left Triceps</option><option value="Right Teres">Target: Right Teres</option><option value="Right Triceps">Target: Right Triceps</option></select><button id="startBtn">Connect Bluetooth & Lock</button></div><div class="slider-container"><label for="sensSlider">SENSITIVITY:</label><input type="range" id="sensSlider" min="1" max="100" value="30"><span id="sensVal">30%</span></div></div><div id="hud"><strong>WIRELESS MOUSE TELEMETRY</strong> [<span id="lockStatus" class="status-unlocked">BLUETOOTH DISCONNECTED</span>]<br>Target: <span id="valTarget" style="color:#00ffcc">Neck (Home)</span><br>X: <span id="valX">0.0</span> mm | Y: <span id="valY">0.0</span> mm<br>Angle: <span id="valAngle">0.0</span>°</div><canvas id="mapCanvas" width="640" height="400"></canvas><script>const canvas=document.getElementById('mapCanvas');const ctx=canvas.getContext('2d');const targetSelect=document.getElementById('targetSelect');const lockStatusDisplay=document.getElementById('lockStatus');const sensSlider=document.getElementById('sensSlider');const sensValDisplay=document.getElementById('sensVal');let robotX=0.0,robotY=0.0,robotAngle=0.0,activeTargetKey="Neck (Home)",startAngleOffset=null,mouseCountsPerMm=7.11;let bleTxCharacteristic=null;function updateSensitivityFactor(val){mouseCountsPerMm=213.3/val;sensValDisplay.innerText=val+"%";}updateSensitivityFactor(sensSlider.value);sensSlider.addEventListener('input',(e)=>{updateSensitivityFactor(parseInt(e.target.value));});const TARGETS={"Neck (Home)":{x:0,y:0,color:"green"},"Left Teres":{x:-120,y:-180,color:"red"},"Left Triceps":{x:-180,y:-280,color:"orange"},"Right Teres":{x:120,y:-180,color:"red"},"Right Triceps":{x:180,y:-280,color:"orange"}};function toCanvasCoords(mmX,mmY){return{x:(canvas.width/2)+(mmX*0.5),y:(canvas.height/2)+(mmY*0.5)};}function drawMap(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle="#222222";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(canvas.width/2,0);ctx.lineTo(canvas.width/2,canvas.height);ctx.moveTo(0,canvas.height/2);ctx.lineTo(canvas.width,canvas.height/2);ctx.stroke();for(const[name,target]of Object.entries(TARGETS)){let pos=toCanvasCoords(target.x,target.y);ctx.beginPath();ctx.arc(pos.x,pos.y,8,0,2*Math.PI);ctx.fillStyle=target.color;ctx.fill();if(name===activeTargetKey){ctx.beginPath();ctx.arc(pos.x,pos.y,14,0,2*Math.PI);ctx.strokeStyle="#00ffcc";ctx.lineWidth=2;ctx.stroke();}ctx.fillStyle="white";ctx.font="bold 10px monospace";ctx.fillText(" "+name,pos.x+10,pos.y+4);}let robotPos=toCanvasCoords(robotX,robotY);ctx.save();ctx.translate(robotPos.x,robotPos.y);ctx.rotate((robotAngle*Math.PI)/180);ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(-8,8);ctx.lineTo(8,8);ctx.closePath();ctx.fillStyle="#00ffcc";ctx.fill();ctx.restore();document.getElementById('valTarget').innerText=activeTargetKey;document.getElementById('valX').innerText=robotX.toFixed(1);document.getElementById('valY').innerText=robotY.toFixed(1);document.getElementById('valAngle').innerText=robotAngle.toFixed(1);sendBluetoothData();}targetSelect.addEventListener('change',(e)=>{activeTargetKey=e.target.value;drawMap();});canvas.addEventListener('click',async()=>{startAngleOffset=null;if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){try{const state=await DeviceOrientationEvent.requestPermission();if(state==='granted')window.addEventListener('deviceorientation',handleCompassInput);}catch(e){}}else{window.addEventListener('deviceorientation',handleCompassInput);}if(!bleTxCharacteristic){try{const device=await navigator.bluetooth.requestDevice({filters:[{namePrefix:'BBC micro:bit'}],optionalServices:['6e400001-b5a3-f393-e0a9-e50e24dcca9e']});const server=await device.gatt.connect();const service=await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');bleTxCharacteristic=await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');lockStatusDisplay.innerText="BLUETOOTH CONNECTED";}catch(err){alert("Bluetooth connection failed: Make sure Bluetooth is enabled and you are using Chrome on Android. "+err);}}canvas.requestPointerLock=canvas.requestPointerLock||canvas.mozRequestPointerLock;canvas.requestPointerLock();});document.addEventListener('pointerlockchange',()=>{if(document.pointerLockElement===canvas){if(bleTxCharacteristic)lockStatusDisplay.innerText="LOCKED & TRANSMITTING";document.addEventListener("mousemove",updatePosition,false);}else{lockStatusDisplay.innerText="UNLOCKED (PAUSED)";document.removeEventListener("mousemove",updatePosition,false);startAngleOffset=null;}});function handleCompassInput(e){let raw=e.webkitCompassHeading||(360-e.alpha);if(raw!==undefined&&raw!==null){if(startAngleOffset===null){startAngleOffset=raw;}robotAngle=(raw-startAngleOffset+360)%360;drawMap();}}function updatePosition(e){let mx=e.movementX||0,my=e.movementY||0,rx=mx/mouseCountsPerMm,ry=my/mouseCountsPerMm,rad=(robotAngle*Math.PI)/180;robotX+=rx*Math.cos(rad)-ry*Math.sin(rad);robotY+=rx*Math.sin(rad)+ry*Math.cos(rad);drawMap();}async function sendBluetoothData(){if(!bleTxCharacteristic)return;let target=TARGETS[activeTargetKey];let dx=target.x-robotX,dy=target.y-robotY;let distance=Math.sqrt(dx*dx+dy*dy);let rSpeed=0,lSpeed=0,vibe=0;if(distance>15){vibe=0;let targetAngle=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;let angleDiff=(targetAngle-robotAngle+540)%360-180;let baseSpeed=400;let steeringCorrection=angleDiff*5;rSpeed=Math.min(Math.max(baseSpeed-steeringCorrection,0),800);lSpeed=Math.min(Math.max(baseSpeed+steeringCorrection,0),800);}else{rSpeed=0;lSpeed=0;vibe=1;}try{let commandString=`${Math.round(rSpeed)},${Math.round(lSpeed)},${vibe}\n`;let encoder=new TextEncoder();await bleTxCharacteristic.writeValue(encoder.encode(commandString));}catch(e){}}drawMap();</script></body></html>
