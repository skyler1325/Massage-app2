<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawler Robot Desktop Pointer-Lock Telemetry</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #1e1e1e;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Prevents background page scrolling while playing */
        }
        #controls {
            width: 100%;
            max-width: 640px;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }
        select, button {
            flex: 1;
            padding: 12px;
            background-color: #333;
            color: #00ffcc;
            border: 2px solid #555;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        button {
            background-color: #00ffcc;
            color: #1e1e1e;
            border: none;
        }
        button:hover {
            background-color: #00cca3;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        #hud {
            width: 100%;
            max-width: 640px;
            margin-bottom: 10px;
            font-size: 14px;
            line-height: 1.4;
            background: #252525;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #00ffcc;
        }
        canvas {
            background-color: #111;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            cursor: crosshair; /* Changes your mouse to a targeting crosshair when hovering */
        }
        #lockMessage {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
            max-width: 640px;
        }
        .status-locked {
            color: #00ffcc !important;
            font-weight: bold;
        }
        .status-unlocked {
            color: #ff3366 !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="controls">
        <select id="targetSelect">
            <option value="Neck (Home)">Target: Neck (Home)</option>
            <option value="Left Teres">Target: Left Teres</option>
            <option value="Left Triceps">Target: Left Triceps</option>
            <option value="Right Teres">Target: Right Teres</option>
            <option value="Right Triceps">Target: Right Triceps</option>
        </select>
        <button id="startBtn">Click Map to Lock Cursor</button>
    </div>

    <div id="hud">
        <strong>DESKTOP POINTER LOCK TELEMETRY</strong> [<span id="lockStatus" class="status-unlocked">CURSOR UNLOCKED</span>]<br>
        Target: <span id="valTarget" style="color:#00ffcc">Neck (Home)</span><br>
        X: <span id="valX">0.0</span> mm | Y: <span id="valY">0.0</span> mm<br>
        Heading: <span id="valAngle">0.0</span>°
    </div>

    <!-- Telemetry Map Grid Viewport -->
    <canvas id="mapCanvas" width="640" height="400"></canvas>
    
    <div id="lockMessage">
        Click directly on the **Black Canvas Box** to lock your mouse like <em>Shell Shockers</em>.<br>
        Press the <strong>ESC (Escape)</strong> key on your keyboard to free your cursor instantly.
    </div>

    <script>
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');
        const targetSelect = document.getElementById('targetSelect');
        const lockStatusDisplay = document.getElementById('lockStatus');

        // --- ROBOT STATE (Driven by raw mouse events) ---
        let robotX = 0.0;
        let robotY = 0.0;
        let robotAngle = 0.0; 
        let activeTargetKey = "Neck (Home)";

        // --- POINTER MOUSE SENSITIVITY CALIBRATION ---
        // Alter this value to match your hand scaling preference.
        // Higher values = requires more physical mouse dragging distance to move 1mm.
        const MOUSE_COUNTS_PER_MM = 36.0; 

        const TARGETS = {
            "Neck (Home)":   { x: 0,    y: 0,    color: "green" },
            "Left Teres":    { x: -120, y: -180, color: "red" },
            "Left Triceps":  { x: -180, y: -280, color: "orange" },
            "Right Teres":   { x: 120,  y: -180, color: "red" },
            "Right Triceps": { x: 180,  y: -280, color: "orange" }
        };

        // Center point mapping context layout
        function toCanvasCoords(mmX, mmY) {
            return {
                x: (canvas.width / 2) + (mmX * 0.5),
                y: (canvas.height / 2) + (mmY * 0.5) 
            };
        }

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw clean background alignment grid crosshairs
            ctx.strokeStyle = "#222222";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.moveTo(0, canvas.height / 2); ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            // 1. Draw Target Nodes
            for (const [name, target] of Object.entries(TARGETS)) {
                let pos = toCanvasCoords(target.x, target.y);
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 8, 0, 2 * Math.PI);
                ctx.fillStyle = target.color;
                ctx.fill();

                if (name === activeTargetKey) {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 14, 0, 2 * Math.PI);
                    ctx.strokeStyle = "#00ffcc";
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }

                ctx.fillStyle = "white";
                ctx.font = "bold 10px monospace";
                ctx.fillText(" " + name, pos.x + 10, pos.y + 4);
            }

            // 2. Draw Vector Robot Arrow
            let robotPos = toCanvasCoords(robotX, robotY);
            ctx.save();
            ctx.translate(robotPos.x, robotPos.y);
            ctx.rotate((robotAngle * Math.PI) / 180); 

            ctx.beginPath();
            ctx.moveTo(0, -12);  
            ctx.lineTo(-8, 8);   
            ctx.lineTo(8, 8);    
            ctx.closePath();
            ctx.fillStyle = "#00ffcc";
            ctx.fill();
            ctx.restore();

            // 3. Render Output Metrics panel
            document.getElementById('valTarget').innerText = activeTargetKey;
            document.getElementById('valX').innerText = robotX.toFixed(1);
            document.getElementById('valY').innerText = robotY.toFixed(1);
            document.getElementById('valAngle').innerText = robotAngle.toFixed(1);
        }

        targetSelect.addEventListener('change', (e) => {
            activeTargetKey = e.target.value;
            drawMap();
        });

        // --- SHELL SHOCKERS CURSOR ENGINE ---
        // Clicking directly onto the tracking graphic canvas triggers pointer capture
        canvas.addEventListener('click', () => {
            canvas.requestPointerLock = canvas.requestPointerLock || canvas.mozRequestPointerLock;
            canvas.requestPointerLock();
        });

        // Track pointer lock state changes to toggle listeners and CSS styles
        document.addEventListener('pointerlockchange', lockChangeAlert, false);
        document.addEventListener('mozpointerlockchange', lockChangeAlert, false);

        function lockChangeAlert() {
            if (document.pointerLockElement === canvas || document.mozPointerLockElement === canvas) {
                // System cursor successfully trapped
                lockStatusDisplay.innerText = "CURSOR LOCKED (ACTIVE)";
                lockStatusDisplay.className = "status-locked";
                
                // Engage the real-world input stream loop
                document.addEventListener("mousemove", updatePosition, false);
            } else {
                // System cursor freed via ESC key
                lockStatusDisplay.innerText = "CURSOR UNLOCKED (PAUSED)";
                lockStatusDisplay.className = "status-unlocked";
                
                document.removeEventListener("mousemove", updatePosition, false);
            }
        }

        // --- UNBOUNDED TRUE HARDWARE DATA PROCESSING ---
        function updatePosition(event) {
            // Read un-bounded data streams straight from the hardware mouse layer
            let movementX = event.movementX || event.mozMovementX || 0;
            let movementY = event.movementY || event.mozMovementY || 0;

            // Simple dead-reckoning engine mapping variables directly
            let deltaX = movementX / MOUSE_COUNTS_PER_MM;
            let deltaY = movementY / MOUSE_COUNTS_PER_MM;

            robotX += deltaX;
            robotY += deltaY;

            // Automatically spin the orientation arrow toward the current dragging direction vector
            if (movementX !== 0 || movementY !== 0) {
                robotAngle = Math.atan2(movementX, -movementY) * (180 / Math.PI);
            }

            drawMap();
        }

        // Render initial view layout frame
        drawMap();
    </script>
</body>
</html>
